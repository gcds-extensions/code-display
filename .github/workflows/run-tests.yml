name: Run Tests
on:
  workflow_dispatch:
  # `main` is tested as well as pull requests. Without this the suite only ran on
  # PR branches, so a commit that landed on `main` outside a PR was never checked:
  # 499b352 added the gcdsPath attribute hours after the specs were written, broke
  # two snapshots, and went unnoticed for six weeks because nothing watched `main`.
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04 # latest version 24 has incompatibility issues (playwright)

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Unit tests"
            script: "npm run test:unit"

          - name: "E2E tests"
            script: "npm run test:e2e"

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Install Playwright Browsers
        if: ${{ !contains(matrix.name, 'Unit tests') }}
        run: npx playwright install --with-deps

      - name: Build repo
        run: npm run build

      - name: Run tests for ${{ matrix.name }}
        run: ${{ matrix.script }}