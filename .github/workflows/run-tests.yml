name: Run Tests
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04 # latest version 24 has incompatibility issues (playwright)

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Unit tests"
            script: "npm run test:unit"

          - name: "E2E tests"
            script: "npm run test:e2e"

    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@dda4788290998366da86b6a4f497909644397bb2
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Install Playwright Browsers
        if: ${{ !contains(matrix.name, 'Unit tests') }}
        run: npx playwright install --with-deps

      - name: Build repo
        run: npm run build

      - name: Run tests for ${{ matrix.name }}
        run: ${{ matrix.script }}